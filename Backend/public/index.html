<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickLink Vault | Professional Link Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-container">
                <div class="logo-icon">
                    <i class="fas fa-folder-tree"></i>
                </div>
                <div class="logo-text">
                    <h1>QuickLink Vault</h1>
                    <p>Organize your professional links efficiently</p>
                </div>
            </div>
            
            <div class="stats-container">
                <div class="stat-box">
                    <div class="stat-icon">
                        <i class="fas fa-folder"></i>
                    </div>
                    <div class="stat-details">
                        <span class="stat-value" id="total-folders">0</span>
                        <span class="stat-label">Folders</span>
                    </div>
                </div>
                <div class="stat-box">
                    <div class="stat-icon">
                        <i class="fas fa-link"></i>
                    </div>
                    <div class="stat-details">
                        <span class="stat-value" id="total-links">0</span>
                        <span class="stat-label">Links</span>
                    </div>
                </div>
                <div class="stat-box">
                    <div class="stat-icon">
                        <i class="fas fa-copy"></i>
                    </div>
                    <div class="stat-details">
                        <span class="stat-value" id="copied-count">0</span>
                        <span class="stat-label">Copied</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Left Sidebar - Forms -->
            <div class="sidebar">
                <!-- Folder Creation Card -->
                <div class="form-card">
                    <div class="form-card-header">
                        <i class="fas fa-folder-plus"></i>
                        <h3>Create New Folder</h3>
                    </div>
                    <form id="folder-form" class="compact-form">
                        <div class="form-group">
                            <label for="folder-name" class="form-label">
                                <i class="fas fa-tag"></i> Folder Name
                            </label>
                            <input 
                                type="text" 
                                id="folder-name" 
                                class="form-input"
                                placeholder="e.g. Social Media, Projects, Work, Personal" 
                                required 
                            />
                        </div>

                        <div class="form-group">
                            <label for="folder-description" class="form-label">
                                <i class="fas fa-align-left"></i> Description (Optional)
                            </label>
                            <input 
                                type="text" 
                                id="folder-description" 
                                class="form-input"
                                placeholder="Brief description of this folder" 
                            />
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary btn-block">
                                <i class="fas fa-plus"></i> Create Folder
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Link Creation Card (Initially Hidden) -->
                <div class="form-card link-form-container hidden">
                    <div class="form-card-header">
                        <i class="fas fa-link"></i>
                        <h3 id="link-form-title">Add Link to <span id="current-folder-name">Folder</span></h3>
                    </div>
                    <form id="link-form" class="compact-form">
                        <div class="form-group">
                            <label for="link-name" class="form-label">
                                <i class="fas fa-tag"></i> Link Label
                            </label>
                            <input 
                                type="text" 
                                id="link-name" 
                                class="form-input"
                                placeholder="e.g. Portfolio, GitHub, LinkedIn" 
                                required 
                            />
                        </div>

                        <div class="form-group">
                            <label for="link-url" class="form-label">
                                <i class="fas fa-link"></i> URL
                            </label>
                            <input 
                                type="url" 
                                id="link-url" 
                                class="form-input"
                                placeholder="https://example.com" 
                                required 
                            />
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-plus"></i> Add Link
                            </button>
                            <button type="button" id="cancel-link-btn" class="btn btn-secondary">
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Right Content - Folders List -->
            <div class="content-area">
                <!-- Search and Controls -->
                <div class="content-header">
                    <div class="header-title">
                        <i class="fas fa-folder"></i>
                        <h2>Your Folders</h2>
                        <span class="badge" id="folders-count">0</span>
                    </div>
                    
                    <div class="header-controls">
                        <div class="search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" 
                                   class="search-input" 
                                   placeholder="Search folders..." 
                                   id="folder-search-input">
                        </div>
                    </div>
                </div>

                <!-- Folders Grid -->
                <div class="folders-grid" id="folders-container">
                    <!-- Folders will be dynamically added here -->
                    <div class="empty-state">
                        <div class="empty-icon">
                            <i class="fas fa-folder-open"></i>
                        </div>
                        <h3>No folders yet</h3>
                        <p>Create your first folder to start organizing links</p>
                        <button class="btn btn-primary btn-icon" id="create-first-folder">
                            <i class="fas fa-plus"></i> Create Folder
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="app-footer">
            <div class="footer-content">
                <p>QuickLink Vault &copy; <span id="current-year">2023</span></p>
                <div class="footer-links">
                    <span>Organized Link Management</span>
                </div>
            </div>
        </footer>
    </div>

    <!-- Modals (unchanged) -->
    <div class="modal hidden" id="folder-modal">
        <!-- ... same as before ... -->
    </div>

    <div class="modal hidden" id="link-modal">
        <!-- ... same as before ... -->
    </div>

    <script src="script.js"></script>
</body>
</html>
